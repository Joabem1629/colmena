# Va DENTRO del bloque server { } de tu dominio. Si usas BASE=/kanban:
location ^~ /kanban/ {
    proxy_pass http://127.0.0.1:3100;          # sin barra ni ruta al final
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
location = /kanban { return 301 /kanban/; }

